[backdrop]
blur_intensity = 0.63999998569488525
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    position = "bottom"
    thickness = 42
    # Делаем панель «парящей» с аккуратными отступами от краёв экрана
    margin_ends = 12
    panel_overlap = 8
    radius = 16
    # Полупрозрачный матовый фон и лёгкая тень для объёма
    background_opacity = 0.72
    shadow = true
    concave_edge_corners = false
    hover_highlight = true
    padding = 14
    show_on_workspace_switch = false
    show_tooltip = true

    start = [ "workspaces" ]
    center = [ "taskbar" ]
    end = [ "tray", "group:g1", "clock", "mpvpaper_2" ]

    [[bar.default.capsule_group]]
    id = "g1"
    enabled = true
    members = [ "network", "volume", "battery" ]
    # Делаем капсулу чуть выразительнее и добавляем тонкую обводку
    fill = "surface"
    opacity = 0.35
    border_width = 1.0
    padding = 10.0
    widget_spacing = 6
    # Настройка анимации раскрытия «гармошки»
    accordion = true
    accordion_direction = "end"
    accordion_duration = 280
    accordion_delay_ms = 50

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [
    "desktop-widget-000000000000000b",
    "desktop-widget-000000000000000c",
    "desktop-widget-000000000000000d",
    "desktop-widget-000000000000000e"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

